# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # Checked by hand against Adyen's script security page, which blocks automated reads. Adyen's example writes a colon after each directive name (script-src: …), which a browser would not read: directives are written without it, as here. Adyen recommends allowing any address (*) in frame-src, because 3D Secure pages come from each card issuer's own address and can't all be listed; it also writes * for img-src, connect-src and form-action without saying why. Those wildcards let a lot through: you can narrow them once your console shows what your payment page really uses. Adyen recommends Subresource Integrity on its script and stylesheet, with the hashes it publishes for each version.
  { en: "687e3284", text: "Vérifié à la main sur la page d'Adyen sur la sécurité des scripts, qui bloque les lectures automatiques. L'exemple d'Adyen met deux-points après chaque nom de directive (script-src: …), ce qu'un navigateur ne lirait pas : les directives s'écrivent sans, comme ici. Adyen recommande d'autoriser n'importe quelle adresse (*) dans frame-src, car les pages 3D Secure viennent de l'adresse de chaque banque émettrice et ne peuvent pas toutes être listées ; il écrit aussi * pour img-src, connect-src et form-action sans dire pourquoi. Ces jokers laissent passer beaucoup de choses : vous pouvez les restreindre quand la console de votre navigateur montre ce que votre page de paiement utilise vraiment. Adyen recommande l'intégrité des sous-ressources (SRI) sur son script et sa feuille de style, avec les hashs qu'il publie pour chaque version." }
