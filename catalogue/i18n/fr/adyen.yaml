warning:
  # Adyen's policy allows any address in connect-src and form-action. On a payment page, that means a script slipped into the page can send what the visitor types, card details included, to any server, and a form can be posted anywhere: your policy won't stop either. Keep the * in frame-src for 3D Secure, but narrow connect-src, form-action and img-src to the addresses your console shows your payment page using.
  { en: 877669ca, text: "La politique d'Adyen autorise n'importe quelle adresse dans connect-src et form-action. Sur une page de paiement, un script glissé dans la page peut donc envoyer ce que le visiteur saisit, coordonnées de carte comprises, vers n'importe quel serveur, et un formulaire peut être envoyé n'importe où : votre politique n'empêchera ni l'un ni l'autre. Gardez le * dans frame-src pour 3D Secure, mais limitez connect-src, form-action et img-src aux adresses que la console montre utilisées par votre page de paiement." }
