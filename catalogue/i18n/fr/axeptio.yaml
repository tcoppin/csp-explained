nonce:
  how:
    # Use 'strict-dynamic' and a per-response nonce in script-src, and pass the same nonce to the widget through axeptioSettings.
    { en: 5fe08565, text: "Utilisez 'strict-dynamic' et un nonce propre à chaque réponse dans script-src, et transmettez le même nonce au widget via axeptioSettings." }
notes:
  # Follows the article's "absolute minimum" list for granular policies. The article also suggests a wider pattern (https://*.axept.io in script-src, 'unsafe-inline' in default-src). Its lists spell the video host both axeptio-video.imgix.net and axeptio-videos.imgix.net, so both are listed.
  { en: 0bef7110, text: "Suit la liste « minimum absolu » de l'article pour les politiques détaillées. L'article propose aussi un modèle plus large (https://*.axept.io dans script-src, 'unsafe-inline' dans default-src). Ses listes écrivent l'hôte des vidéos à la fois axeptio-video.imgix.net et axeptio-videos.imgix.net : les deux sont listés." }
