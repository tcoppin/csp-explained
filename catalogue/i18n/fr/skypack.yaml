# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # Skypack resolves each package's imports to shared addresses its docs don't name, so this entry allows the host rather than one package's address.
  { en: 66a0fbfd, text: "Skypack renvoie les imports de chaque paquet vers des adresses partagées que sa documentation ne nomme pas, donc cette fiche autorise l'hôte plutôt que l'adresse d'un paquet." }
warning:
  # Allowing all of Skypack lets code from anyone run on your site. It serves any package published on npm, so an attacker who manages to slip a script into one of your pages can load their own code from it, and your policy won't stop it. A nonce with 'strict-dynamic' protects you without listing the host.
  { en: d692a50c, text: "Autoriser tout Skypack permet au code de n'importe qui de s'exécuter sur votre site. Il sert n'importe quel paquet publié sur npm : un attaquant qui parvient à glisser un script dans l'une de vos pages peut y charger son propre code depuis Skypack, et votre politique ne l'arrêtera pas. Un nonce avec 'strict-dynamic' vous protège sans lister l'hôte." }
features:
  modules:
    label:
      # Modules from Skypack
      { en: 9112068c, text: "Modules depuis Skypack" }
    reasons:
      script:
        # Loads the modules and their dependencies.
        { en: 251e38e8, text: "Charge les modules et leurs dépendances." }
