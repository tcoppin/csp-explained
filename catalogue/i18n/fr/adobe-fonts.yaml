        # Loads the font kit's script.
        { en: f712b8d9, text: "Charge le script du kit de polices." }
      style:
        # Loads the font kit's stylesheet.
        { en: 907f0517, text: "Charge la feuille de style du kit de polices." }
      inline-style:
        # The kit adds inline styles, which font events need.
        { en: 8064f49a, text: "Le kit ajoute des styles en ligne, dont les événements de police ont besoin." }
      img:
        # Counts font use with a tracking image, so foundries are paid.
        { en: 9f3b336e, text: "Compte l'usage des polices par une image de suivi, pour rémunérer les fonderies." }
  performance:
    label:
      # Performance metrics
      { en: 5167b9cd, text: "Mesures de performance" }
    reasons:
      connect:
        # Sends performance metrics about Adobe's font network.
        { en: 6a570209, text: "Envoie des mesures de performance sur le réseau de polices d'Adobe." }
