# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # Checked by hand against Adobe's CSP page, which blocks automated reads. Adobe itself advises against using a CSP with Adobe Fonts: its font events need 'unsafe-inline' in style-src, which lets inline styles from any address through. The page says the service also uses fonts as data: URIs but doesn't name the font-src it needs: if your console shows fonts blocked, add use.typekit.net (and data: if Adobe's fonts still fail) to font-src. Adobe warns that a policy blocking its tracking image can break its Terms of Use.
  { en: 5e1fc179, text: "Vérifié à la main sur la page CSP d'Adobe, qui bloque les lectures automatiques. Adobe déconseille lui-même d'utiliser une CSP avec Adobe Fonts : ses événements de police demandent 'unsafe-inline' dans style-src, ce qui laisse passer les styles en ligne de n'importe quelle adresse. La page indique que le service utilise aussi des polices en URI data:, sans dire quel font-src il lui faut : si la console de votre navigateur montre des polices bloquées, ajoutez use.typekit.net (et data: si les polices d'Adobe échouent encore) à font-src. Adobe prévient qu'une politique qui bloque son image de suivi peut enfreindre ses conditions d'utilisation." }
features:
  web-project:
