# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

nonce:
  how:
    # When loaded through Google Tag Manager or the Google tag with a nonce, the nonce is passed on.
    { en: 6a404a9b, text: "Chargé par Google Tag Manager ou la balise Google avec un nonce, le nonce est transmis." }
notes:
  # With advertising features (Google Signals, remarketing), Google also asks to list https://*.google.<TLD> for every country domain your visitors use (google.fr, google.de, …). Those country domains are not checked here.
  { en: c4904ce7, text: "Avec les fonctionnalités publicitaires (Google Signals, remarketing), Google demande aussi de lister https://*.google.<TLD> pour chaque domaine national utilisé par vos visiteurs (google.fr, google.de…). Ces domaines nationaux ne sont pas vérifiés ici." }
features:
  measurement:
    label:
      # Measurement (without advertising features)
      { en: c8c08073, text: "Mesure (sans fonctionnalités publicitaires)" }
    reasons:
      script:
        # Loads the Google tag (gtag.js).
        { en: 66083d68, text: "Charge la balise Google (gtag.js)." }
      img:
        # Sends hits as image pixels.
        { en: 4933fdb5, text: "Envoie les hits sous forme de pixels." }
      connect:
        # Sends hits to the collection servers.
        { en: 30e2c55f, text: "Envoie les hits aux serveurs de collecte." }
  advertising-features:
    label:
      # Advertising features (Google Signals, remarketing)
      { en: 81e1f7aa, text: "Fonctionnalités publicitaires (Google Signals, remarketing)" }
    reasons:
      img:
        # Ads-related pixels.
        { en: 4bfd8b47, text: "Pixels liés à la publicité." }
      connect:
        # Ads-related requests.
        { en: 826d94fe, text: "Requêtes liées à la publicité." }
      frame:
        # Ads-related frame.
        { en: 779cf373, text: "Cadre lié à la publicité." }
  tag-gateway:
    description:
      # The Google tag loads from a path on your own site. Your server or CDN must not add your Content-Security-Policy header to the responses from that path, or the service worker is blocked.
      { en: 08ab3ca1, text: "La balise Google se charge depuis un chemin de votre propre site. Votre serveur ou votre CDN ne doit pas ajouter votre en-tête Content-Security-Policy aux réponses de ce chemin, sinon le service worker est bloqué." }
    label:
      # Google tag gateway for advertisers
      { en: 71e70e0f, text: "Passerelle de balise Google pour les annonceurs" }
    reasons:
      script:
        # Loads the Google tag from your measurement path.
        { en: ac0228b0, text: "Charge la balise Google depuis votre chemin de mesure." }
      img:
        # Sends measurement requests to your measurement path.
        { en: c56d567f, text: "Envoie les requêtes de mesure à votre chemin de mesure." }
      connect:
        # Sends measurement requests to your measurement path.
        { en: c56d567f, text: "Envoie les requêtes de mesure à votre chemin de mesure." }
      worker:
        # Runs a service worker from your measurement path.
        { en: 25a3dd51, text: "Exécute un service worker depuis votre chemin de mesure." }
  server-side-same-origin:
    description:
      # With the tagging server on a subdomain instead (sgtm.yoursite.com), allow that address in img-src, connect-src and frame-src (and script-src-elem if the Google tag loads from it); no worker-src is needed. On a path of your site, your server or CDN must not add your Content-Security-Policy header to its responses, or the service worker is blocked.
      { en: 3189acb9, text: "Si le serveur de taggage est plutôt sur un sous-domaine (sgtm.votresite.fr), autorisez cette adresse dans img-src, connect-src et frame-src (et script-src-elem si la balise Google se charge depuis lui) ; worker-src n'est pas nécessaire. Sur un chemin de votre site, votre serveur ou votre CDN ne doit pas ajouter votre en-tête Content-Security-Policy à ses réponses, sinon le service worker est bloqué." }
    label:
      # Server-side tagging, on a path of your site
      { en: 1d15d063, text: "Taggage côté serveur, sur un chemin de votre site" }
    reasons:
      img:
        # Sends measurement requests to your tagging server.
        { en: 3239de6e, text: "Envoie les requêtes de mesure à votre serveur de taggage." }
      connect:
        # Sends measurement requests to your tagging server.
        { en: 3239de6e, text: "Envoie les requêtes de mesure à votre serveur de taggage." }
      frame:
        # Registers the service worker through a frame.
        { en: 1366a0ad, text: "Enregistre le service worker au moyen d'un cadre." }
      worker:
        # Runs a service worker from your tagging server.
        { en: ec96642b, text: "Exécute un service worker depuis votre serveur de taggage." }
