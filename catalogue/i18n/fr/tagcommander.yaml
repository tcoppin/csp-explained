# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # Tags fired by the container (analytics, ads, …) have their own requirements: check those tools too. With Commanders Act Gateway, scripts and measurement go through a path or domain of your own: allow 'self' (or that domain) in script-src, connect-src, img-src and frame-src instead. The consent banner is TrustCommander, a separate entry.
  { en: d075f040, text: "Les tags déclenchés par le conteneur (mesure, publicité, …) ont leurs propres besoins : vérifiez aussi ces outils. Avec Commanders Act Gateway, les scripts et les mesures passent par un chemin ou un domaine à vous : autorisez plutôt 'self' (ou ce domaine) dans script-src, connect-src, img-src et frame-src. La bannière de consentement est TrustCommander, une fiche à part." }
features:
