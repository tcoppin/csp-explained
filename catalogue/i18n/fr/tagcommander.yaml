        { en: 8bddfc37, text: "Envoie les mesures par des pixels." }
      connect:
        # Sends measurement requests.
        { en: 2b2c992c, text: "Envoie les requêtes de mesure." }
      frame:
        # Frames some measurement methods use, Google's among them.
        { en: e661fb56, text: "Cadres qu'utilisent certaines méthodes de mesure, dont celles de Google." }
  campaign-analytics:
