      script:
        # Loads the enrichment script.
        { en: a29c5a39, text: "Charge le script d'enrichissement." }
      img:
        # Sends data as image pixels.
        { en: ef40ebe7, text: "Envoie les données par des pixels." }
      connect:
        # Sends data to Commanders Act.
        { en: 230bacdb, text: "Envoie les données à Commanders Act." }
