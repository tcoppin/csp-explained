notes:
  # Vue's docs give the CDN address but say nothing about a Content-Security-Policy. The build they show (vue.global.js) compiles templates in the browser; what that needs under a CSP isn't documented, so 'unsafe-eval' isn't listed here. Builds named vue.runtime.* don't include the compiler.
  { en: 386c9f93, text: "La documentation de Vue donne l'adresse du CDN, mais ne dit rien de la Content-Security-Policy. La version qu'elle montre (vue.global.js) compile les templates dans le navigateur ; ce que cela demande dans une CSP n'est pas documenté, donc 'unsafe-eval' n'est pas listé ici. Les versions nommées vue.runtime.* ne contiennent pas le compilateur." }
