# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

features:
  whole-host:
    label:
      # Any file from jsDelivr
      { en: 06d05683, text: "N'importe quel fichier de jsDelivr" }
    reasons:
      script:
        # Loads scripts from jsDelivr.
        { en: 9ba23ac6, text: "Charge des scripts depuis jsDelivr." }
      style:
        # Loads stylesheets from jsDelivr.
        { en: fb185808, text: "Charge des feuilles de style depuis jsDelivr." }
warning:
  # Allowing all of jsDelivr lets code from anyone run on your site. Anyone can publish files there, so an attacker who manages to slip a script into one of your pages can load their own code from jsDelivr, and your policy won't stop it. Allow only the libraries you use, by their own address (https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/): each library in this catalogue gives one.
  { en: 3b53e9f0, text: "Autoriser tout jsDelivr permet au code de n'importe qui de s'exécuter sur votre site. Tout le monde peut y publier des fichiers : un attaquant qui parvient à glisser un script dans l'une de vos pages peut y charger son propre code depuis jsDelivr, et votre politique ne l'arrêtera pas. N'autorisez que les bibliothèques que vous utilisez, par leur propre adresse (https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/) : chaque bibliothèque de ce catalogue en donne une." }
notes:
  # jsDelivr's documentation gives one address for every file it serves, https://cdn.jsdelivr.net (npm packages, GitHub, WordPress plugins and themes, and /combine/ for several files at once). A /combine/ address isn't under any one library's folder: if you allow libraries one by one, load them separately.
  { en: b853cc3f, text: "La documentation de jsDelivr donne une seule adresse pour tous les fichiers qu'il sert, https://cdn.jsdelivr.net (paquets npm, GitHub, extensions et thèmes WordPress, et /combine/ pour plusieurs fichiers à la fois). Une adresse /combine/ n'est sous le dossier d'aucune bibliothèque : si vous autorisez les bibliothèques une par une, chargez-les séparément." }
