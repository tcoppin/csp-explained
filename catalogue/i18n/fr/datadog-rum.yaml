        { en: e09675d7, text: "Vérifie le quota de profilage de votre site Datadog." }
fields:
  intake:
    description:
      # The site in your Datadog address: app.datadoghq.eu is EU1, us5.datadoghq.com is US5. Until it is picked, the address data is sent to isn't in the policy.
      { en: "3073e9b3", text: "Le site de votre adresse Datadog : app.datadoghq.eu correspond à EU1, us5.datadoghq.com à US5. Tant qu'il n'est pas choisi, l'adresse où partent les données n'est pas dans la politique." }
    label:
      # Your Datadog site
      { en: "2497606c", text: "Votre site Datadog" }
