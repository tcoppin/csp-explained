    label:
      # Browser SDK from Datadog's CDN
      { en: 4a341f7b, text: "Browser SDK depuis le CDN de Datadog" }
    reasons:
      script:
        # Loads the SDK.
        { en: 0a636ba6, text: "Charge le SDK." }
  session-replay:
    label:
      # Session Replay or compressed requests
      { en: c91215af, text: "Session Replay ou requêtes compressées" }
