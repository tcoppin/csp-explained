notes:
  # The worker can also be hosted on your own site (workerUrl option) instead of allowing blob:. For a site in US2-FED, Datadog asks to check with its support that the CSP integration is available.
  { en: "8a0f8673", text: "Le worker peut aussi être hébergé sur votre site (option workerUrl) au lieu d'autoriser blob:. Pour un site en US2-FED, Datadog demande de vérifier auprès de son support que l'intégration CSP est disponible." }
features:
