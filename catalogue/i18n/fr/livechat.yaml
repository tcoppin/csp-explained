# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

nonce:
  how:
    # Put your nonce on the LiveChat script tag and in script-src, with *.livechatinc.com: 'unsafe-inline' is then not needed for the snippet.
    { en: 06e1b5e0, text: "Mettez votre nonce sur la balise script de LiveChat et dans script-src, avec *.livechatinc.com : 'unsafe-inline' n'est alors plus nécessaire pour le snippet." }
notes:
  # Follows LiveChat's list of exact hosts. Its other example also puts 'unsafe-eval', *.youtube.com and *.google.com in several directives, without saying what needs them: add them only if your console shows them blocked.
  { en: 3df09ad5, text: "Suit la liste d'hôtes exacts de LiveChat. Son autre exemple met aussi 'unsafe-eval', *.youtube.com et *.google.com dans plusieurs directives, sans dire ce qui en a besoin : ajoutez-les seulement si votre console les montre bloqués." }
features:
