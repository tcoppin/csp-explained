      # Chat widget
      { en: ac7ef7fe, text: "Widget de chat" }
    reasons:
      script:
        # Loads the widget.
        { en: 0cca323b, text: "Charge le widget." }
      inline-script:
        # The snippet is written in the page (or use a nonce).
        { en: 8d88d2f3, text: "Le snippet est écrit dans la page (ou utilisez un nonce)." }
      connect:
        # Sends and receives messages.
        { en: 75eba12d, text: "Envoie et reçoit les messages." }
      frame:
        # Shows the chat window.
        { en: 794c2e01, text: "Affiche la fenêtre de chat." }
      font:
        # The widget's fonts.
        { en: f511a2d6, text: "Polices du widget." }
      media:
        # Sounds and media.
        { en: 7bfed9a4, text: "Sons et médias." }
      img:
        # Avatars, images and shared files.
        { en: 1ded7e5e, text: "Avatars, images et fichiers partagés." }
      inline-style:
        # The widget adds styles to the page.
        { en: 7c10cdec, text: "Le widget ajoute des styles à la page." }
