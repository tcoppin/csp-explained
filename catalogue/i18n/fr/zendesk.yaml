# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

nonce:
  how:
    # Zendesk recommends Google's strict CSP: add your nonce to the Web Widget snippet. Zendesk doesn't guarantee the widget under other policies.
    { en: 39a60b1e, text: "Zendesk recommande la CSP stricte de Google : ajoutez votre nonce au snippet du Web Widget. Zendesk ne garantit pas le widget avec d'autres politiques." }
notes:
  # Zendesk lists these addresses in default-src and asks to add them to script-src and connect-src when you have those directives. Its list also has https://*.ingest.*.sentry.io, which isn't a valid CSP source (a wildcard can only come first) and is left out.
  { en: 91c4eebc, text: "Zendesk liste ces adresses dans default-src et demande de les ajouter à script-src et connect-src si vous avez ces directives. Sa liste contient aussi https://*.ingest.*.sentry.io, qui n'est pas une source CSP valide (un joker ne peut venir qu'en premier) et n'est pas reprise." }
