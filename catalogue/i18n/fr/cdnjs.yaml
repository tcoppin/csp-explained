# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # cdnjs gives an integrity (SRI) hash for every file.
  { en: e3759913, text: "cdnjs donne un hash d'intégrité (SRI) pour chaque fichier." }
features:
  whole-host:
    label:
      # Any file from cdnjs
      { en: 694aaac9, text: "N'importe quel fichier de cdnjs" }
    reasons:
      script:
        # Loads scripts from cdnjs.
        { en: 77af7dfc, text: "Charge des scripts depuis cdnjs." }
      style:
        # Loads stylesheets from cdnjs.
        { en: e4f07858, text: "Charge des feuilles de style depuis cdnjs." }
  polyfill:
    description:
      # Cloudflare's copy of the polyfill.io service, after the polyfill.io domain changed hands in 2024. Replace any polyfill.io address in your pages and policy with this one.
      { en: 124a3489, text: "La copie du service polyfill.io par Cloudflare, après le changement de propriétaire du domaine polyfill.io en 2024. Remplacez toute adresse polyfill.io dans vos pages et votre politique par celle-ci." }
    label:
      # Polyfill service (replaces polyfill.io)
      { en: a7fd2d13, text: "Service de polyfills (remplace polyfill.io)" }
    reasons:
      script:
        # Loads the polyfills the visitor's browser needs.
        { en: a8bf97b0, text: "Charge les polyfills dont le navigateur du visiteur a besoin." }
warning:
  # Allowing all of cdnjs lets thousands of libraries run on your site, including old ones attackers know how to use to get around a policy. If an attacker manages to slip a script into one of your pages, your policy won't stop it. Allow only the libraries you use, by their own folder (https://cdnjs.cloudflare.com/ajax/libs/jquery/): each library in this catalogue gives one.
  { en: 3ffbbc5d, text: "Autoriser tout cdnjs permet à des milliers de bibliothèques de s'exécuter sur votre site, y compris d'anciennes que les attaquants savent utiliser pour contourner une politique. Si un attaquant parvient à glisser un script dans l'une de vos pages, votre politique ne l'arrêtera pas. N'autorisez que les bibliothèques que vous utilisez, par leur propre dossier (https://cdnjs.cloudflare.com/ajax/libs/jquery/) : chaque bibliothèque de ce catalogue en donne un." }
