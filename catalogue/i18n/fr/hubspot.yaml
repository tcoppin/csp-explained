# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

nonce:
  how:
    # On pages hosted by HubSpot, the "Enable nonce" setting adds a nonce to every script from HubSpot. On your own site, HubSpot's page doesn't say how its scripts take a nonce.
    { en: c6038e6f, text: "Sur les pages hébergées par HubSpot, le réglage « Enable nonce » ajoute un nonce à chaque script de HubSpot. Sur votre propre site, la page de HubSpot ne dit pas comment ses scripts reçoivent un nonce." }
notes:
  # HubSpot's list is written for pages hosted on HubSpot; it's the only public list, so this entry applies it to HubSpot's code on your own site. It covers accounts in HubSpot's main US data centre (NA1): EU1, NA2, NA3 and AP1 accounts use other addresses, listed on the same page.
  { en: 5decb240, text: "La liste de HubSpot est écrite pour les pages hébergées par HubSpot ; c'est la seule liste publique, donc cette fiche l'applique au code de HubSpot sur votre propre site. Elle couvre les comptes du principal centre de données américain de HubSpot (NA1) : les comptes EU1, NA2, NA3 et AP1 utilisent d'autres adresses, listées sur la même page." }
