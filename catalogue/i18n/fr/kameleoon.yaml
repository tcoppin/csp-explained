# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

notes:
  # Checked by hand against Kameleoon's developer documentation, which automated reads couldn't open. Follows its complete setup. Kameleoon also offers an easy setup that puts its domains in default-src with wildcards (any address under kameleoon.com, .io, .eu and .net, and experimentation.dev); a script-src line overrides it, so don't mix both. Its policy lists 'unsafe-eval' in script-src and 'unsafe-inline' in style-src without saying which part needs them. The same page names data.kameleoon.net, needed to QA experiments across subdomains with the Simulation tool, without saying which directive it belongs to: add it where your console shows it blocked. Kameleoon adds features over time, which can bring new addresses.
  { en: ca3cb8b2, text: "Vérifié à la main sur la documentation développeur de Kameleoon, que les lectures automatiques n'ont pas pu ouvrir. Suit sa configuration complète. Kameleoon propose aussi une configuration simple qui met ses domaines dans default-src avec des jokers (toute adresse sous kameleoon.com, .io, .eu et .net, et experimentation.dev) ; une ligne script-src prend le pas sur elle, donc ne mélangez pas les deux. Sa politique met 'unsafe-eval' dans script-src et 'unsafe-inline' dans style-src sans dire ce qui en a besoin. La même page cite data.kameleoon.net, nécessaire pour tester des expériences sur plusieurs sous-domaines avec l'outil Simulation, sans dire à quelle directive il appartient : ajoutez-le là où la console le montre bloqué. Kameleoon ajoute des fonctions au fil du temps, ce qui peut amener de nouvelles adresses." }
fields:
  sitecode:
    description:
      # As in your Kameleoon script address: the part before .kameleoon.eu or .kameleoon.io (projects use one or the other depending on when they were created; the Kameleoon App shows yours). Left empty, every Kameleoon project is allowed.
      { en: 900213ff, text: "Comme dans l'adresse de votre script Kameleoon : la partie avant .kameleoon.eu ou .kameleoon.io (les projets utilisent l'un ou l'autre selon leur date de création ; l'application Kameleoon affiche le vôtre). Laissé vide, tous les projets Kameleoon sont autorisés." }
    label:
      # Your site code
      { en: 0cf95f2f, text: "Votre code de site" }
