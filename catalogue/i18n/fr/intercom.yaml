nonce:
  how:
    # Intercom supports strict nonce-based CSP Level 3 policies. If your site already uses one, no change is needed apart from nonces on the scripts the Messenger loads.
    { en: f18ed7ce, text: "Intercom gère les politiques CSP Level 3 strictes à base de nonces. Si votre site en utilise déjà une, rien à changer à part les nonces sur les scripts que charge le Messenger." }
notes:
