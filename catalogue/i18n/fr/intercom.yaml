  { en: 703be17b, text: "Cette fiche couvre les espaces de travail hébergés aux États-Unis. Les espaces européens et australiens utilisent des domaines régionaux (par ex. api-iam.eu.intercom.io, uploads.intercomcdn.eu) : voir l'article officiel." }
