# fr text for the English entry of the same name. Text only: hosts, types and dates come from English.
# en: hash of the English text this was translated from (yarn i18n:status fr --write adds it).

nonce:
  how:
    # Intercom supports strict nonce-based CSP Level 3 policies. If your site already uses one, no change is needed apart from nonces on the scripts the Messenger loads.
    { en: f18ed7ce, text: "Intercom gère les politiques CSP Level 3 strictes à base de nonces. Si votre site en utilise déjà une, rien à changer à part les nonces sur les scripts que charge le Messenger." }
notes:
  # Intercom's article gives one list for every region. Only the CDN addresses depend on where the workspace is hosted (uploads, downloads, messenger-apps, static.intercomassets and intercom-attachments): each feature has its region's, and the rest of the list as written. Your workspace settings say which region it is in.
  { en: d8b01f77, text: "L'article d'Intercom donne une seule liste pour toutes les régions. Seules les adresses de CDN dépendent de l'hébergement de l'espace de travail (uploads, downloads, messenger-apps, static.intercomassets et intercom-attachments) : chaque fonctionnalité a celles de sa région, et le reste de la liste tel qu'il est écrit. Les réglages de votre espace de travail indiquent sa région." }
