id: bootstrap
name: Bootstrap
category: library
website: https://getbootstrap.com
sources:
  - https://getbootstrap.com/docs/5.3/getting-started/introduction/
  - https://getbootstrap.com/docs/4.6/getting-started/introduction/
  - https://getbootstrap.com/docs/3.4/getting-started/
lastVerified: 2026-11-23
confidence: verified
notes: >-
  The CDN addresses include the version: when you upgrade Bootstrap, change the version in your policy too.
  Bootstrap's docs give an integrity hash for every CDN file; keep it on the tag. Bootstrap 5.3's colour mode
  script is meant to sit at the top of the page: if you paste it inline, give it your nonce or move it to a file.
features:
  - id: v5
    label: Bootstrap 5.3 from jsDelivr
    default: true
    requirements:
      - type: style
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/]
        reason: Loads Bootstrap's stylesheet.
      - type: script
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/]
        reason: Loads Bootstrap's JavaScript (the bundle includes Popper).
  - id: v5-popper
    label: Popper loaded separately (Bootstrap 5.3)
    description: Only when you use bootstrap.min.js instead of the bundle.
    requirements:
      - type: script
        sources: [https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/]
        reason: Loads Popper, which places dropdowns, tooltips and popovers.
  - id: v4
    label: Bootstrap 4.6 from jsDelivr
    description: Bootstrap 4 no longer gets updates.
    requirements:
      - type: style
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/]
        reason: Loads Bootstrap's stylesheet.
      - type: script
        sources:
          - https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/
          - https://cdn.jsdelivr.net/npm/jquery@3.5.1/
          - https://cdn.jsdelivr.net/npm/popper.js@1.16.1/
        reason: Loads Bootstrap's JavaScript, jQuery and Popper.
      - type: img
        sources: ["data:"]
        reason: >-
          Icons drawn as embedded SVGs in background images (close button, checkboxes, switches,
          validation icons, select, carousel controls, navbar toggler).
  - id: v3
    label: Bootstrap 3.4 from jsDelivr
    description: Bootstrap 3 no longer gets updates.
    requirements:
      - type: style
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/]
        reason: Loads Bootstrap's stylesheet and optional theme.
      - type: script
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/, https://code.jquery.com]
        reason: Loads Bootstrap's JavaScript and jQuery.
      - type: font
        sources: [https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/]
        reason: The Glyphicons font, loaded by the stylesheet.
