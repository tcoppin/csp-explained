id: skypack
name: Skypack
category: cdn
website: https://www.skypack.dev
sources:
  - https://docs.skypack.dev/
  - https://docs.skypack.dev/skypack-cdn/api-reference/lookup-urls.md
lastVerified: 2026-11-23
confidence: partial
notes: >-
  Skypack resolves each package's imports to shared addresses its docs don't name, so this entry allows the
  host rather than one package's address.
warning: >-
  Allowing all of Skypack lets code from anyone run on your site. It serves any package published on npm, so an
  attacker who manages to slip a script into one of your pages can load their own code from it, and your policy
  won't stop it. A nonce with 'strict-dynamic' protects you without listing the host.
features:
  - id: modules
    label: Modules from Skypack
    default: true
    requirements:
      - type: script
        sources: [https://cdn.skypack.dev]
        reason: Loads the modules and their dependencies.
