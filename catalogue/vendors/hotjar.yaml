id: hotjar
name: Hotjar
category: session-replay
website: https://www.hotjar.com
sources:
  - https://help.hotjar.com/hc/en-us/articles/36820026388881-Content-Security-Policies
lastVerified: 2026-10-29
confidence: verified
notes: >-
  Checked by hand against the help article, which blocks automated reads. Follows its "absolute minimum"
  allowances; the article also offers a default-src template and a wider per-directive template with
  https://*.hotjar.com, which covers these hosts too.
features:
  - id: tracking
    label: Tracking code
    default: true
    requirements:
      - type: script
        sources: [https://static.hotjar.com, https://script.hotjar.com]
        reason: Loads the tracking script.
      - type: inline-script
        sources: ["'unsafe-inline'"]
        reason: The tracking code is an inline snippet.
      - type: connect
        sources: [https://*.hotjar.com, https://*.hotjar.io, wss://*.hotjar.com]
        reason: Sends recordings and events (including over WebSocket).
      - type: img
        sources: [https://static.hotjar.com, https://script.hotjar.com, https://survey-images.hotjar.com]
        reason: Hotjar images, including survey images.
      - type: font
        sources: [https://script.hotjar.com]
        reason: Hotjar fonts.
      - type: style
        sources: [https://static.hotjar.com, https://script.hotjar.com]
        reason: Loads Hotjar's styles.
      - type: inline-style
        sources: ["'unsafe-inline'"]
        reason: Survey and feedback widgets inject their styles.
