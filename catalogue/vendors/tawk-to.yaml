id: tawk-to
name: tawk.to
category: chat
website: https://www.tawk.to
sources:
  - https://help.tawk.to/article/why-are-images-not-showing-up-in-the-widget
lastVerified: 2026-11-23
confidence: verified
notes: >-
  Checked by hand against tawk.to's help page, which blocks automated reads. Its list allows all of
  cdn.jsdelivr.net, which lets any npm package run: see jsDelivr in the catalogue.
features:
  - id: widget
    label: Chat widget
    default: true
    requirements:
      - type: script
        sources: [https://*.tawk.to, https://cdn.jsdelivr.net]
        reason: Loads the widget.
      - type: style
        sources: [https://*.tawk.to, https://fonts.googleapis.com, https://cdn.jsdelivr.net]
        reason: The widget's styles.
      - type: frame
        sources: [https://*.tawk.to]
        reason: Shows the chat window.
      - type: font
        sources: [https://*.tawk.to, https://fonts.gstatic.com]
        reason: The widget's fonts.
      - type: img
        sources: [https://*.tawk.to, https://cdn.jsdelivr.net, https://tawk.link, https://s3.amazonaws.com]
        reason: Avatars, images and shared files.
      - type: connect
        sources: [https://*.tawk.to, wss://*.tawk.to]
        reason: Sends and receives messages (including over WebSocket).
      - type: form
        sources: [https://*.tawk.to]
        reason: Sends the widget's forms.
  - id: knowledge-base
    label: Knowledge Base articles
    default: false
    requirements:
      - type: connect
        sources: [https://*.tawk.help]
        reason: Loads the Knowledge Base articles.
