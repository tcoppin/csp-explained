id: esm-sh
name: esm.sh
category: cdn
website: https://esm.sh
sources:
  - https://esm.sh/
  - https://github.com/esm-dev/esm.sh
lastVerified: 2026-11-23
confidence: partial
notes: >-
  esm.sh rewrites each module's imports to its dependencies, and its docs don't say at which addresses: a
  package's own address (https://esm.sh/react@19.2.4) may not be enough, so this entry allows the host.
  raw.esm.sh serves the same files untouched; add it if you use it.
warning: >-
  Allowing all of esm.sh lets code from anyone run on your site. It serves any package published on npm, JSR or
  GitHub, so an attacker who manages to slip a script into one of your pages can load their own code from it, and
  your policy won't stop it. A nonce with 'strict-dynamic' protects you without listing the host.
features:
  - id: modules
    label: Modules from esm.sh
    default: true
    requirements:
      - type: script
        sources: [https://esm.sh]
        reason: Loads the modules and their dependencies.
  - id: import-map
    label: Import map written in the page
    description: >-
      The import map esm.sh's docs show is a <script> written in the page. Give it your nonce or its hash
      rather than allowing every inline script.
    requirements:
      - type: inline-script
        sources: ["'unsafe-inline'"]
        reason: The import map is a script written in the page.
