id: unpkg
name: unpkg
category: cdn
website: https://unpkg.com
sources:
  - https://unpkg.com/
lastVerified: 2026-11-23
confidence: verified
notes: >-
  Addresses with a version range or no version redirect to the exact version: after a redirect the browser only
  checks the host, so a package address still works.
warning: >-
  Allowing all of unpkg lets code from anyone run on your site. Anyone can publish a package on npm and unpkg
  serves every one, so an attacker who manages to slip a script into one of your pages can load their own code
  from it, and your policy won't stop it. Allow only the packages you use, by their own address
  (https://unpkg.com/vue@3/).
features:
  - id: whole-host
    label: Any file from unpkg
    default: true
    requirements:
      - type: script
        sources: [https://unpkg.com]
        reason: Loads scripts from unpkg.
      - type: style
        sources: [https://unpkg.com]
        reason: Loads stylesheets from unpkg.
