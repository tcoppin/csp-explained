id: youtube
name: YouTube embeds
category: other
website: https://www.youtube.com
sources:
  - https://developers.google.com/youtube/player_parameters
  - https://developers.google.com/youtube/iframe_api_reference
  - https://support.google.com/youtube/answer/171780
lastVerified: 2026-11-27
confidence: partial
notes: >-
  YouTube publishes no CSP page: these are the addresses its embedding docs use. The IFrame Player API's
  documentation doesn't say whether it works with the privacy-enhanced mode's address.
features:
  - id: embed
    label: Embedded player
    default: true
    requirements:
      - type: frame
        sources: [https://www.youtube.com]
        reason: Shows the player.
  - id: iframe-api
    label: IFrame Player API
    requirements:
      - type: script
        sources: [https://www.youtube.com]
        reason: Loads the API that controls the player from your scripts.
  - id: privacy-enhanced
    label: Privacy-enhanced mode
    description: >-
      Embeds from www.youtube-nocookie.com instead of www.youtube.com: in the embed code, only the address
      changes.
    requirements:
      - type: frame
        sources: [https://www.youtube-nocookie.com]
        reason: Shows the player in privacy-enhanced mode.
