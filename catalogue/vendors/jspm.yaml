id: jspm
name: JSPM
category: cdn
website: https://jspm.org
sources:
  - https://jspm.org/cdn/jspm-io
  - https://jspm.org/getting-started
lastVerified: 2026-11-23
confidence: verified
notes: >-
  Packages and their dependencies all load from ga.jspm.io, each at its exact version
  (https://ga.jspm.io/npm:lit@3.3.0/). JSPM recommends import maps with integrity hashes, which protect against
  a compromised file. The older jspm.dev and dev.jspm.io CDNs are deprecated.
warning: >-
  Allowing all of ga.jspm.io lets code from anyone run on your site. It serves any package published on npm, so
  an attacker who manages to slip a script into one of your pages can load their own code from it, and your
  policy won't stop it. A nonce with 'strict-dynamic' protects you without listing the host.
features:
  - id: modules
    label: Modules from ga.jspm.io
    default: true
    requirements:
      - type: script
        sources: [https://ga.jspm.io]
        reason: Loads the modules, their dependencies and ES Module Shims.
  - id: import-map
    label: Import map written in the page
    default: true
    description: >-
      JSPM writes the import map into the page as a <script>. Give it your nonce or its hash rather than
      allowing every inline script.
    requirements:
      - type: inline-script
        sources: ["'unsafe-inline'"]
        reason: The import map is a script written in the page.
  - id: systemjs
    label: SystemJS builds
    requirements:
      - type: script
        sources: [https://ga.system.jspm.io]
        reason: Loads the SystemJS versions of the modules.
