id: google-analytics
name: Google Analytics 4
category: analytics
website: https://marketingplatform.google.com/about/analytics/
sources:
  - https://developers.google.com/tag-platform/security/guides/csp
lastVerified: 2026-11-16
confidence: verified
nonce:
  supported: true
  how: When loaded through Google Tag Manager or the Google tag with a nonce, the nonce is passed on.
notes: >-
  With advertising features (Google Signals, remarketing), Google also asks to list
  https://*.google.<TLD> for every country domain your visitors use (google.fr, google.de, …).
  Those country domains are not checked here.
features:
  - id: measurement
    label: Measurement (without advertising features)
    default: true
    requirements:
      - type: script
        sources: [https://www.googletagmanager.com]
        reason: Loads the Google tag (gtag.js).
      - type: img
        sources: [https://www.googletagmanager.com, https://*.google-analytics.com]
        reason: Sends hits as image pixels.
      - type: connect
        sources: [https://www.googletagmanager.com, https://*.google-analytics.com, https://*.google.com]
        reason: Sends hits to the collection servers.
  - id: advertising-features
    label: Advertising features (Google Signals, remarketing)
    requirements:
      - type: img
        sources: [https://*.google.com, https://*.g.doubleclick.net]
        reason: Ads-related pixels.
      - type: connect
        sources: [https://*.g.doubleclick.net, https://pagead2.googlesyndication.com]
        reason: Ads-related requests.
      - type: frame
        sources: [https://www.googletagmanager.com]
        reason: Ads-related frame.
  - id: tag-gateway
    label: Google tag gateway for advertisers
    description: >-
      The Google tag loads from a path on your own site. Your server or CDN must not add your
      Content-Security-Policy header to the responses from that path, or the service worker is blocked.
    requirements:
      - type: script
        sources: ["'self'"]
        reason: Loads the Google tag from your measurement path.
      - type: img
        sources: ["'self'"]
        reason: Sends measurement requests to your measurement path.
      - type: connect
        sources: ["'self'"]
        reason: Sends measurement requests to your measurement path.
      - type: worker
        sources: ["'self'"]
        reason: Runs a service worker from your measurement path.
  - id: server-side-same-origin
    label: Server-side tagging, on a path of your site
    description: >-
      With the tagging server on a subdomain instead (sgtm.yoursite.com), allow that address in img-src,
      connect-src and frame-src (and script-src-elem if the Google tag loads from it); no worker-src is needed.
      On a path of your site, your server or CDN must not add your Content-Security-Policy header to its
      responses, or the service worker is blocked.
    requirements:
      - type: img
        sources: ["'self'"]
        reason: Sends measurement requests to your tagging server.
      - type: connect
        sources: ["'self'"]
        reason: Sends measurement requests to your tagging server.
      - type: frame
        sources: ["'self'"]
        reason: Registers the service worker through a frame.
      - type: worker
        sources: ["'self'"]
        reason: Runs a service worker from your tagging server.
