yarnPath: .yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules
enableTelemetry: false

# Peer dependencies that upstream packages expect to be provided (npm auto-installs peers, Yarn doesn't).
packageExtensions:
  "@napi-rs/wasm-runtime@*":
    dependencies:
      "@emnapi/core": "^1.7.1"
      "@emnapi/runtime": "^1.7.1"
