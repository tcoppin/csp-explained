# Weekly version updates, one grouped pull request per ecosystem. Security updates are separate
# (repository settings) and are not delayed by the cooldown.
version: 2
updates:
  # Site and infra/ (Yarn workspaces share the root lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Yarn refuses versions younger than a day (npmMinimalAgeGate); waiting a week also lets
    # compromised releases be caught and pulled before they reach us.
    cooldown:
      default-days: 7
    # Titles must follow Conventional Commits (CI checks them); `chore` doesn't call for a release.
    commit-message:
      prefix: 'chore(deps)'
    # `astro check` refuses TypeScript 7 for now: remove once @astrojs/check supports it.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      npm:
        patterns: ['*']

  # Actions are pinned to commit SHAs (a moved tag can't change what runs); Dependabot updates the SHA
  # and the version comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
