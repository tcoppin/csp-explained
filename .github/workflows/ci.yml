name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Versions come from commit titles: every new commit must follow the convention (CONTRIBUTING.md › Commit messages).
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Check the new commit titles
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch has no previous commit to compare with.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) echo "New branch: nothing to compare"; exit 0;; esac
          yarn tsx scripts/release.ts check "$RANGE"

  # The site job runs in Microsoft's Playwright image, which already has Chromium and its system packages:
  # installing them on the runner needs Ubuntu's mirrors, and an outage there stalled CI. The image must
  # match the @playwright/test version we install, so its tag is read from the lockfile.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: yarn.lock
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(awk '/^"@playwright\/test@npm:/ { found = 1 } found && /^  version:/ { print $2; exit }' yarn.lock)
          test -n "$version" || { echo "::error::@playwright/test not found in yarn.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  site:
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-resolute
    # A normal run takes about 3 minutes; a stalled download would otherwise hold the runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn catalogue:validate
      - run: yarn test
      - run: yarn check
      - run: yarn build
      - run: yarn test:e2e

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn workspace csp-explained-infra typecheck
      - run: yarn workspace csp-explained-infra synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: ca-central-1
