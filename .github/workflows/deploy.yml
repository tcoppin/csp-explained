name: Deploy

# Requires repository variables (Settings › Secrets and variables › Actions › Variables),
# all printed as outputs by `cdk deploy` in infra/:
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, SITE_BUCKET, DISTRIBUTION_ID

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → short-lived AWS credentials

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after CI on a push to this repository's main: the branch filter above also matches pull
    # requests from a fork's own "main", which must never reach production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload fingerprinted assets (cached for a year)
        run: aws s3 sync dist/_astro "s3://${{ vars.SITE_BUCKET }}/_astro" --cache-control "public, max-age=31536000, immutable"
      - name: Upload pages and other files (short cache)
        run: aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_astro/*" --cache-control "public, max-age=300"
      - name: Remove outdated assets
        run: aws s3 sync dist/_astro "s3://${{ vars.SITE_BUCKET }}/_astro" --delete --cache-control "public, max-age=31536000, immutable"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"

  # Once the site is live: if the commits since the last tag call for a release (feat, fix, breaking change),
  # tag the deployed commit and publish the GitHub release. Versions come from commit titles (scripts/release.ts).
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Tag and publish the release, if one is due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yarn tsx scripts/release.ts next notes.md)
          if [ -z "$version" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"
          gh release create "v$version" --verify-tag --title "v$version" --notes-file notes.md --latest
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
