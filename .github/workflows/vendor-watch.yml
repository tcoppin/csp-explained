name: Watch vendor docs

# Weekly check of every vendor's official CSP documentation. When CSP-relevant content
# changes (a domain or directive added or removed), opens a pull request that updates
# catalogue/doc-snapshots.json and lists the changes, so a human can update the catalogue entry.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Compare vendor documentation with the last snapshot
        run: |
          yarn tsx scripts/watch-vendor-docs.ts --update > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: catalogue/vendor-docs-changed
          title: 'chore(catalogue): vendor CSP documentation changed'
          commit-message: 'chore(catalogue): update vendor documentation snapshots'
          add-paths: catalogue/doc-snapshots.json
          body-path: report.md
          labels: catalogue
